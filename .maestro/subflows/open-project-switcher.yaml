# Main menu -> the swap icon next to the project name -> "StraboField Projects" (New / Download / Open / Import).
appId: org.StraboSpot2
---
- runFlow: open-main-menu.yaml
- runFlow:
    when:
      visible: { id: "switch-project-button" }
    commands:
      - tapOn: { id: "switch-project-button" }
      - waitForAnimationToEnd
- runFlow:
    # Builds from before the switch-project-button testID: the icon sits at the menu header's right edge.
    when:
      notVisible: "LOAD A PROJECT"
    commands:
      - tapOn: { point: "68%,12%" }
- extendedWaitUntil:
    visible: "LOAD A PROJECT"
    timeout: 10000
