# Main menu -> Backup -> Upload the open project to the StraboSpot server and wait for "All Uploaded!".
appId: org.StraboSpot2
---
- runFlow: close-side-panels.yaml
- tapOn: { id: "main-menu-button" }
- tapOn: "Backup"
- tapOn: "Upload"
- assertVisible: "Upload Project"
- tapOn: "Upload"
- extendedWaitUntil:
    visible: "All Uploaded!"
    timeout: 120000
- tapOn: "OK"
- runFlow: close-side-panels.yaml
