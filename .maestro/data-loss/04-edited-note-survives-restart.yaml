# Editing existing data must keep the new value after a relaunch (not revert to the old one).
appId: org.StraboSpot2
name: Edited note survives a force-quit
tags: [data-loss]
---
- runFlow: ../subflows/start-guest-project.yaml
- runFlow: ../subflows/add-point-spot.yaml
- runFlow: { file: ../subflows/add-note.yaml, env: { NOTE: "Original note E2E-04" } }
- runFlow: ../subflows/force-quit-and-relaunch.yaml
- tapOn: "Notebook"
- runFlow: { file: ../subflows/add-note.yaml, env: { NOTE: "Edited note E2E-04" } }
- runFlow: ../subflows/force-quit-and-relaunch.yaml
- tapOn: "Notebook"
- assertVisible: "Edited note E2E-04"
- assertNotVisible: "Original note E2E-04"
