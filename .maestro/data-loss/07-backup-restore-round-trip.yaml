# Saving a backup to the device and restoring it brings back exactly what was backed up:
# Spots added and notes edited after the backup are rolled back, the backed-up note is intact.
appId: org.StraboSpot2
name: Device backup restores the backed-up Spots and note
tags: [data-loss, backup]
---
- runFlow: ../subflows/start-guest-project.yaml
- runFlow: ../subflows/add-point-spot.yaml
- runFlow: { file: ../subflows/add-note.yaml, env: { NOTE: "Backed-up note BK-07" } }
- runFlow: { file: ../subflows/save-backup.yaml, env: { BACKUP_NAME: "E2E-bk07", ZIP: "false" } }
# Changes after the backup.
- runFlow: { file: ../subflows/open-spot-from-list.yaml, env: { SPOT: "01" } }
- runFlow: { file: ../subflows/add-note.yaml, env: { NOTE: "Changed after backup BK-07" } }
- runFlow: { file: ../subflows/add-point-spot.yaml, env: { X: "60", Y: "55" } }
- runFlow: { file: ../subflows/assert-dataset-spot-count.yaml, env: { COUNT: "2" } }
- runFlow: { file: ../subflows/restore-saved-backup.yaml, env: { BACKUP_NAME: "E2E-bk07" } }
- runFlow: { file: ../subflows/assert-dataset-spot-count.yaml, env: { COUNT: "1" } }
- runFlow: { file: ../subflows/open-spot-from-list.yaml, env: { SPOT: "01" } }
- assertVisible: "Backed-up note BK-07"
- assertNotVisible: "Changed after backup BK-07"
