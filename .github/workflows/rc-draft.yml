name: Draft Release from RC

on:
  push:
    branches:
      - 'rc-*'

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Get version and previous bump commit
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")

          # Find the most recent commit that changed package.json to a DIFFERENT version
          # That commit marks the end of the previous version's work
          PREV_BUMP=$(git log --format="%H" -- package.json | while read hash; do
            v=$(git show "$hash":package.json | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version}catch(e){''}" 2>/dev/null)
            if [ -n "$v" ] && [ "$v" != "$VERSION" ]; then
              echo "$hash"
              break
            fi
          done)

          echo "=== DEBUG ==="
          echo "VERSION: $VERSION"
          echo "PREV_BUMP: $PREV_BUMP"
          echo "============="

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prev_bump=$PREV_BUMP" >> $GITHUB_OUTPUT

      - name: Generate Draft Changelog
        run: |
          PREV=${{ steps.meta.outputs.prev_bump }}
          VERSION=${{ steps.meta.outputs.version }}

          changelog=$(git log $PREV..HEAD --pretty=format:"%s" | awk '
          /^feat/ { features[++fc] = $0 }
          /^fix/  { fixes[++bc] = $0 }
          /^chore/ { chores[++cc] = $0 }
          /^docs/ { docs[++dc] = $0 }
          /^refactor/ { refactors[++rc] = $0 }
          END {
            print "## v'"$VERSION"' - DRAFT - '"$(date +%Y-%m-%d)"'\n"
            print "> ⚠️ This is a pre-release draft for testing purposes only.\n"
            if (fc > 0) { print "### ✨ Features"; for (i=1;i<=fc;i++) print "- " features[i]; print "" }
            if (bc > 0) { print "### 🐛 Bug Fixes"; for (i=1;i<=bc;i++) print "- " fixes[i]; print "" }
            if (rc > 0) { print "### ♻️ Refactors"; for (i=1;i<=rc;i++) print "- " refactors[i]; print "" }
            if (dc > 0) { print "### 📝 Docs"; for (i=1;i<=dc;i++) print "- " docs[i]; print "" }
            if (cc > 0) { print "### 🔧 Chores"; for (i=1;i<=cc;i++) print "- " chores[i]; print "" }
          }')

          echo "$changelog" > release_notes.md
          cat release_notes.md

      - name: Delete existing draft release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRAFT_TAG="v${{ steps.meta.outputs.version }}-draft"
          RELEASE_ID=$(gh release view "$DRAFT_TAG" --repo ${{ github.repository }} --json id -q '.id' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            gh release delete "$DRAFT_TAG" --repo ${{ github.repository }} --yes
            git push origin :refs/tags/$DRAFT_TAG || true
          fi

      - name: Create Updated Draft Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.meta.outputs.version }} (Draft)"
          body_path: release_notes.md
          draft: true
          prerelease: true
          tag_name: "v${{ steps.meta.outputs.version }}-draft"
