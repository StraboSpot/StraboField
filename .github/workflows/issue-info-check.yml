name: Issue Info Check

on:
  issues:
    types: [opened, edited, reopened, labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-info-check-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    # Skip PR comments, and only re-check on a comment from the issue's own author.
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || github.event.comment.user.login == github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Check issue for missing details
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-info-check.js');
            await run({github, context, core});
